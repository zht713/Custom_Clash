;Custom_OpenClash_Rules
;全分组防 DNS 泄漏订阅转换模板
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules
;基于 ACL4SSR 模板魔改而来，感谢原作者！
;<建议>搭配本项目配套设置，实现最佳化的 OpenClash 使用效果！
;设置方案：https://github.com/Aethersailor/Custom_OpenClash_Rules/wiki/OpenClash-%E8%AE%BE%E7%BD%AE%E6%96%B9%E6%A1%88

[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果
ruleset=🚀 故障转移,[]GEOSITE,gfw
ruleset=🚀 故障转移,[]GEOIP,telegram,no-resolve
ruleset=🚀 故障转移,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
ruleset=🚀 故障转移,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
ruleset=🎯 全球直连,[]FINAL
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,1800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
ruleset=🚀 测速工具,[]GEOSITE,category-speedtest
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🌎 国外媒体,[]GEOSITE,category-entertainment
ruleset=🚀 GitHub,[]GEOSITE,github
ruleset=🐟 漏网之鱼,[]FINAL
ruleset=🔀 非标端口,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

;设置规则标志位结束

;设置节点分组标志位
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🚀 故障转移`fallback`.*`https://cp.cloudflare.com/generate_204`300,5
custom_proxy_group=🎯 全球直连`select`[]DIRECT`http://wifi.vivo.com.cn/generate_204
custom_proxy_group=🚀 GitHub`fallback`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🇰🇷 韩国节点`[]♻️ 自动选择`[]🎯 全球直连`https://cp.cloudflare.com/generate_204`300,5
custom_proxy_group=🤖 ChatGPT`fallback`[]♻️ 自动选择`.*$`https://cp.cloudflare.com/generate_204`300,5
custom_proxy_group=🤖 AI服务`fallback`.*$`https://cp.cloudflare.com/generate_204`300,5
custom_proxy_group=🌎 国外媒体`fallback`.*$`https://cp.cloudflare.com/generate_204`300,5
custom_proxy_group=🐟 漏网之鱼`fallback`.*$`https://cp.cloudflare.com/generate_204`300,5
custom_proxy_group=🔀 非标端口`select`[]🐟 漏网之鱼`[]🎯 全球直连

;设置分组标志位结束

;下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true
